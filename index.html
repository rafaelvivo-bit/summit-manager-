function addManualMonth() {
  const grid = document.querySelector('.month-input-grid');
  if (!grid) {
    // Create the grid if it doesn't exist (no months detected)
    const container = document.querySelector('.modal h3:last-of-type');
    if (container) {
      const warn = container.nextElementSibling?.nextElementSibling;
      if (warn && warn.classList.contains('pdf-status')) warn.remove();
      const newGrid = document.createElement('div');
      newGrid.className = 'month-input-grid';
      container.parentElement.insertBefore(newGrid, container.nextElementSibling?.nextElementSibling);
    }
    return addManualMonth();
  }
  const now = new Date();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const yyyy = now.getFullYear();
  const div = document.createElement('div');
  div.className = 'month-input-item';
  div.innerHTML = `
    <label><input type="text" value="${yyyy}-${mm}" style="width:80px;text-align:left;font-size:11px;padding:2px 4px" data-month-key> <span style="cursor:pointer;color:var(--red);font-size:14px" onclick="this.closest('.month-input-item').remove()">×</span></label>
    <input type="number" step="0.01" value="0" data-month="" data-bruto="0" data-nr="0">
    <div style="font-size:9px;color:var(--text3);margin-top:2px">Manual</div>
  `;
  // Update data-month on key input change
  const keyInput = div.querySelector('[data-month-key]');
  const valInput = div.querySelector('[data-month]');
  keyInput.addEventListener('input', () => { valInput.dataset.month = keyInput.value; });
  valInput.dataset.month = `${yyyy}-${mm}`;
  grid.appendChild(div);
}

function closePDFModal() {
  const modal = document.getElementById('pdf-modal');
  if (modal) modal.remove();
  currentPDFResult = null;
}

async function confirmPDFExtrato() {
  try {
    const email = currentPDFEmail;
    const result = currentPDFResult;
    if (!email || !result) { toast('Erro: email ou resultado ausente'); return; }

    // Read edited values from modal
    const inputs = document.querySelectorAll('#pdf-modal .month-input-grid input[data-month]');
    const meses = {};
    inputs.forEach(inp => {
      const month = inp.dataset.month || inp.closest('.month-input-item')?.querySelector('[data-month-key]')?.value;
      if (!month) return;
      const val = parseFloat(inp.value) || 0;
      if (val > 0) meses[month] = val;
    });

    if (Object.keys(meses).length === 0) {
      toast('Nenhum mês com valor > 0');
      return;
    }

    // Initialize plaquinha entry if needed
    if (!STATE.plaquinhas[email]) {
      const aluno = STATE.summit.find(p => p.email === email);
      STATE.plaquinhas[email] = {
        nome: aluno ? aluno.nome : '',
        extratos: []
      };
    }
    const plaq = STATE.plaquinhas[email];
    if (!plaq.extratos) plaq.extratos = [];

    // Collect warnings about failed/unread files
    const failedWarnings = (result.warnings || []).filter(w => w.includes('não lido'));

    // Add this extrato
    plaq.extratos.push({
      id: Date.now(),
      filename: result.filename,
      banco: result.banco,
      periodo: result.periodo,
      meses: meses,
      alertas: failedWarnings
    });

    // Recalc this aluno
    recalcAlunoPlaquinhas(email);

    // Save to localStorage (instant) + Firebase (await completion)
    toast('Salvando...', 2000);
    await saveState(true); // wait for Firebase write to complete

    closePDFModal();
    toast(`✅ Extrato salvo para ${plaq.nome || email}`);
    renderAll();
  } catch(err) {
    console.error('ERRO em confirmPDFExtrato:', err);
    toast('❌ Erro ao salvar: ' + err.message, 8000);
  }
}

function removeExtrato(email, extratoId) {
  const plaq = STATE.plaquinhas[email];
  if (!plaq || !plaq.extratos) return;
  plaq.extratos = plaq.extratos.filter(e => e.id !== extratoId);
  if (plaq.extratos.length === 0) {
    delete STATE.plaquinhas[email];
  } else {
    recalcAlunoPlaquinhas(email);
  }
  saveState();
  renderAll();
}

function recalcAlunoPlaquinhas(email) {
  const plaq = STATE.plaquinhas[email];
  if (!plaq) return;
  if (!plaq.extratos || plaq.extratos.length === 0) return;

  // Consolidar meses de todos os extratos
  const mesesConsolidado = {};
  plaq.extratos.forEach(ext => {
    if (!ext.meses) return;
    for (const [m, v] of Object.entries(ext.meses)) {
      mesesConsolidado[m] = (mesesConsolidado[m] || 0) + v;
    }
  });

  plaq.meses = mesesConsolidado;
  const monthValues = Object.values(mesesConsolidado);
  plaq.fat_total = monthValues.reduce((s, v) => s + v, 0);
  plaq.fat_maior_mes = monthValues.length ? Math.max(...monthValues) : 0;

  const ptier = classifyPlaquinhaTotal(plaq.fat_total);
  plaq.plaq_total = ptier ? ptier.label : '—';

  const mensaisAcumulo = classifyPlaquinhasMensaisAcumulo(mesesConsolidado);
  plaq.plaq_mensais = mensaisAcumulo;
  plaq.plaq_mensal_labels = mensaisAcumulo.map(m => m.tier.label);
  plaq.plaq_mensal = mensaisAcumulo.length ? mensaisAcumulo[0].tier.label : '—';
  plaq.qtd_plaquinhas_mensais = mensaisAcumulo.length;
}

// ========== REBUILD ENGINE ==========
function categoriaTipo(tipo) {
  const t = (tipo||'').toLowerCase();
  if (t.includes('externo')) return 'Cortesia Externa';
  if (t.includes('pgto') || t.includes('pgt') || t.includes('lote') || t.includes('upgrade')) return 'Venda Paga Externa';
  if (t.includes('2ª cadeira') || t.includes('segunda cadeira')) return '2ª Cadeira';
  if (t.includes('tribo') || t.includes('convidado')) return 'Cortesia Aluno (Tribo)';
  return 'Outro';
}

function tierTipo(tipo) {
  const t = (tipo||'').toLowerCase();
  if (t.includes('premium')) return 'Premium';
  if (t.includes('black')) return 'Black';
  if (t.includes('silver')) return 'Silver';
  return 'N/D';
}

// Helper: get field from object trying multiple key variations
function getField(obj, ...keys) {
  for (const k of keys) {
    if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') return String(obj[k]).trim();
  }
  // Try case-insensitive
  const objKeys = Object.keys(obj);
  for (const k of keys) {
    const found = objKeys.find(ok => ok.toLowerCase().trim() === k.toLowerCase().trim());
    if (found && obj[found] !== undefined && obj[found] !== null) return String(obj[found]).trim();
  }
  return '';
}

function rebuildSummit() {
  const alunosByEmail = {};
  RAW.alunos.forEach(a => {
    const e = ne(getField(a, 'Email', 'email', 'E-mail'));
    if (e) alunosByEmail[e] = a;
  });

  const bcByEmail = {};
  RAW.bc_summit.forEach(r => {
    const e = ne(getField(r, 'Email', 'email', 'E-mail'));
    const pres = getField(r, 'Presença', 'Presenca', 'Presencia');
    if (e && pres === 'Sim') bcByEmail[e] = r;
  });

  // Sympla approved
  const symplaByEmail = {};
  RAW.sympla_summit.forEach(r => {
    const status = getField(r, 'Estado de pagamento', 'Status');
    if (status !== 'Aprovado') return;
    const e = ne(getField(r, 'Email', 'email', 'E-mail'));
    if (!e) return;
    const tipo = getField(r, 'Tipo de ingresso');
    const nome = (getField(r, 'Nome') + ' ' + getField(r, 'Sobrenome')).trim();
    const tel = getField(r, 'Telefone com DDD', 'Telefone');
    if (!symplaByEmail[e]) symplaByEmail[e] = [];
    symplaByEmail[e].push({ nome, tipo, cat: categoriaTipo(tipo), tier: tierTipo(tipo), tel });
  });

  // Build mansão lookup from two sources
  const mansaoEmails = new Set();
  // Source 1: BC Mansão CSV — column "Mansão" = "Sim"
  RAW.bc_mansao.forEach(r => {
    const e = ne(getField(r, 'Email', 'email', 'E-mail'));
    const mansao = getField(r, 'Mansão');
    if (e && mansao === 'Sim') mansaoEmails.add(e);
  });
  // Source 2: BC Summit — column "Mansão" = "Sim"
  RAW.bc_summit.forEach(r => {
    const e = ne(getField(r, 'Email', 'email', 'E-mail'));
    const mansao = getField(r, 'Mansão');
    if (e && mansao === 'Sim') mansaoEmails.add(e);
  });
  console.log('Mansão emails encontrados:', mansaoEmails.size);

  const allEmails = new Set([...Object.keys(bcByEmail), ...Object.keys(symplaByEmail)]);
  const pessoas = [];

  const ORDER = { Premium:3, Black:2, Silver:1, 'N/D':0 };

  allEmails.forEach(e => {
    const sy = symplaByEmail[e] || [];
    const bc = bcByEmail[e] || null;
    const al = alunosByEmail[e] || null;

    const nome = sy.length ? sy[0].nome : (bc ? getField(bc, 'Aluno', 'Nome') : '');
    const tel = sy.length ? sy[0].tel : (bc ? getField(bc, 'Telefone') : '');
    const programa = (al ? getField(al, 'Programa') : (bc ? getField(bc, 'Programa') : '')) || '';
    const estrategista = (al ? getField(al, 'Estrategista') : (bc ? getField(bc, 'Estrategista') : '')) || '';

    let tierMax = 'N/D';
    sy.forEach(s => { if ((ORDER[s.tier]||0) > (ORDER[tierMax]||0)) tierMax = s.tier; });

    const cats = [...new Set(sy.map(s=>s.cat))].join(', ');
    const isAtivo = !!bc;
    const todasExt = sy.length > 0 && sy.every(s => s.cat==='Venda Paga Externa' || s.cat==='Cortesia Externa');
    const isAluno = !!al;
    const isExterno = todasExt && !isAluno;

    const ingressoErrado = (isAluno && !isAtivo && sy.length > 0) ? 'Errado' : 'OK';

    let segmento = 'Convidado/Outro';
    if (isAtivo || isAluno) segmento = 'Aluno';
    else if (isExterno) segmento = 'Externo';

    let origem = '—';
    if (bc && sy.length) origem = 'BC + Sympla';
    else if (bc) origem = 'Só BC';
    else if (sy.length) origem = 'Só Sympla';

    const has_mansao = mansaoEmails.has(e);

    pessoas.push({
      email: e, nome, telefone: tel, programa, estrategista,
      segmento, tierMax, categorias: cats, origem, ingressoErrado,
      no_bc: !!bc, no_sympla: sy.length > 0,
      qtd_sympla: sy.length, is_chronos: programa.toLowerCase().includes('chronos'),
      has_mansao
    });
  });

  STATE.summit = pessoas;
  saveState();
  renderAll();
}

function rebuildMansao() {
  const bcByEmail = {};
  RAW.bc_mansao.forEach(r => {
    const e = ne(getField(r, 'Email', 'email', 'E-mail'));
    if (e) bcByEmail[e] = r;
  });

  const symplaByEmail = {};
  RAW.sympla_mansao.forEach(r => {
    const status = getField(r, 'Estado de pagamento', 'Status');
    if (status !== 'Aprovado') return;
    const e = ne(getField(r, 'Email', 'email', 'E-mail'));
    if (!e) return;
    const nome = (getField(r, 'Nome') + ' ' + getField(r, 'Sobrenome')).trim();
    const tipo = getField(r, 'Tipo de ingresso');
    const tel = getField(r, 'Telefone com DDD', 'Telefone');
    if (!symplaByEmail[e]) symplaByEmail[e] = [];
    symplaByEmail[e].push({ nome, tipo, tel });
  });

  const allEmails = new Set([...Object.keys(bcByEmail), ...Object.keys(symplaByEmail)]);
  const pessoas = [];

  allEmails.forEach(e => {
    const sy = symplaByEmail[e] || [];
    const bc = bcByEmail[e] || null;
    const nome = bc ? getField(bc, 'Aluno', 'Nome') : (sy.length ? sy[0].nome : '');
    const tel = bc ? getField(bc, 'Telefone') : (sy.length ? sy[0].tel : '');
    const programa = bc ? getField(bc, 'Programa') : '';
    const conv = bc ? (getField(bc, 'Convidados') || '0') : '0';
    const presSummit = bc ? getField(bc, 'Presença Summit', 'Presença') : '';

    // Find in summit data for segmento
    const summitP = STATE.summit.find(p => p.email === e);
    const segmento = summitP ? summitP.segmento : (bc ? 'Aluno' : 'Não localizado');
    const tier = summitP ? summitP.tierMax : 'N/D';

    let origem = '—';
    if (bc && sy.length) origem = 'BC + Sympla';
    else if (bc) origem = 'Só BC';
    else if (sy.length) origem = 'Só Sympla';

    pessoas.push({
      email: e, nome, telefone: tel, programa, segmento, tier,
      presenca_summit: presSummit, convidados: conv, origem,
      no_bc: !!bc, no_sympla: sy.length > 0
    });
  });

  STATE.mansao = pessoas;
  saveState();
  renderAll();
}

// ========== SORTABLE TABLE HELPER ==========
let sortState = {};

function renderSortableTable(containerId, data, columns, tableId, rowClassFn) {
  const panel = document.getElementById(containerId);

  // Controls
  const filtersHTML = columns.filter(c=>c.filter).map(c => {
    const vals = [...new Set(data.map(r=>r[c.key]||''))].sort();
    return `<select data-filter="${c.key}" onchange="filterTable('${tableId}')">
      <option value="">Todos: ${c.label}</option>
      ${vals.map(v=>`<option value="${v}">${v}</option>`).join('')}
    </select>`;
  }).join('');

  let html = `
    <div class="table-controls" id="controls-${tableId}">
      <input type="text" placeholder="Buscar por nome, email..." oninput="filterTable('${tableId}')" data-search>
      ${filtersHTML}
      <span class="count" id="count-${tableId}">${data.length} registros</span>
    </div>
    <div class="table-wrap">
      <table id="table-${tableId}">
        <thead><tr>
          ${columns.map(c=>`<th data-col="${c.key}" onclick="sortTable('${tableId}','${c.key}')">${c.label}<span class="sort-arrow">⇅</span></th>`).join('')}
        </tr></thead>
        <tbody>
  `;

  data.forEach((r,i) => {
    const cls = rowClassFn ? rowClassFn(r) : '';
    html += `<tr class="${cls}" data-idx="${i}">`;
    columns.forEach(c => {
      let val = r[c.key] !== undefined ? r[c.key] : '';
      if (c.render) val = c.render(val, r);
      else if (c.badge) val = badgeHTML(val, c.badge);
      html += `<td>${val}</td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  panel.innerHTML = html;

  // Store data ref
  panel._data = data;
  panel._columns = columns;
}

function badgeHTML(val, type) {
  if (type === 'tier') {
    const cls = val==='Premium' ? 'badge-premium' : val==='Black' ? 'badge-black' : val==='Silver' ? 'badge-silver' : '';
    return cls ? `<span class="badge ${cls}">${val}</span>` : val;
  }
  if (type === 'yesno') {
    return val ? `<span class="badge badge-sim">SIM</span>` : `<span class="badge badge-nao">NÃO</span>`;
  }
  return val;
}

function filterTable(tableId) {
  const container = document.getElementById('controls-' + tableId);
  const search = (container.querySelector('[data-search]').value || '').toLowerCase();
  const filters = {};
  container.querySelectorAll('[data-filter]').forEach(sel => {
    if (sel.value) filters[sel.dataset.filter] = sel.value;
  });

  const rows = document.querySelectorAll(`#table-${tableId} tbody tr`);
  let visible = 0;
  rows.forEach(tr => {
    const text = tr.textContent.toLowerCase();
    let show = !search || text.includes(search);
    if (show) {
      for (const [key, val] of Object.entries(filters)) {
        const cellIdx = [...document.querySelectorAll(`#table-${tableId} th`)].findIndex(th=>th.dataset.col===key);
        if (cellIdx >= 0) {
          const cellText = tr.cells[cellIdx]?.textContent?.trim() || '';
          if (cellText !== val) { show = false; break; }
        }
      }
    }
    tr.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  document.getElementById('count-' + tableId).textContent = `${visible} registros`;
}

function sortTable(tableId, col) {
  const key = tableId + '_' + col;
  const dir = sortState[key] === 'asc' ? 'desc' : 'asc';
  sortState[key] = dir;

  const tbody = document.querySelector(`#table-${tableId} tbody`);
  const rows = [...tbody.querySelectorAll('tr')];
  const colIdx = [...document.querySelectorAll(`#table-${tableId} th`)].findIndex(th=>th.dataset.col===col);

  rows.sort((a,b) => {
    let va = a.cells[colIdx]?.textContent?.trim() || '';
    let vb = b.cells[colIdx]?.textContent?.trim() || '';
    const na = parseFloat(va), nb = parseFloat(vb);
    if (!isNaN(na) && !isNaN(nb)) return dir==='asc' ? na-nb : nb-na;
    return dir==='asc' ? va.localeCompare(vb,'pt') : vb.localeCompare(va,'pt');
  });

  rows.forEach(r => tbody.appendChild(r));
}

      <p style="margin:0 0 20px;font-size:12px;color:var(--text3)">${email}</p>

      <!-- Summary cards -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px">
        <div style="background:var(--bg2);border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Faturamento Total</div>
          <div style="font-size:16px;font-weight:700;color:var(--green)">${fmt(fatTotal)}</div>
        </div>
        <div style="background:var(--bg2);border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Meses com Dados</div>
          <div style="font-size:16px;font-weight:700;color:var(--text1)">${sortedMonths.length}</div>
        </div>
        <div style="background:var(--bg2);border-radius:8px;padding:12px;text-align:center">
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">Total Plaquinhas</div>
          <div style="font-size:16px;font-weight:700;color:var(--yellow)">${totalPlaquinhas}</div>
        </div>
      </div>

      <!-- Month-by-month table -->
      <h3 style="margin:0 0 8px;font-size:14px;color:var(--text2)">Faturamento Mês a Mês</h3>
      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px">
        <thead><tr style="border-bottom:1px solid var(--border)">
          <th style="padding:6px 12px;text-align:left;color:var(--text3)">Mês</th>
          <th style="padding:6px 12px;text-align:right;color:var(--text3)">Valor</th>
          <th style="padding:6px 12px;text-align:center;color:var(--text3)">Plaquinha Mensal</th>
        </tr></thead>
        <tbody>
          ${mesesRows}
          <tr style="border-top:2px solid var(--border);font-weight:700">
            <td style="padding:8px 12px">TOTAL</td>
            <td style="padding:8px 12px;text-align:right;color:var(--green)">${fmt(fatTotal)}</td>
            <td></td>
          </tr>
        </tbody>
      </table>

      <!-- Plaquinhas earned -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
        <div>
          <h3 style="margin:0 0 8px;font-size:14px;color:var(--text2)">🏆 Plaquinha Fat. Total</h3>
          ${ptotalHtml}
        </div>
        <div>
          <h3 style="margin:0 0 8px;font-size:14px;color:var(--text2)">🌟 Plaquinhas Mensais (${mensais.length})</h3>
          ${mensaisHtml}
        </div>
      </div>

      ${extratosHtml}

      <div style="text-align:right;margin-top:16px">
        <button onclick="document.getElementById('resumo-modal').remove()" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px">Fechar</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function filterPlaq() {
  const container = document.getElementById('controls-plaq');
  const search = (container.querySelector('[data-search]').value || '').toLowerCase();
  const statusFilter = document.getElementById('plaq-filter-status').value;
  const ptotalFilter = document.getElementById('plaq-filter-ptotal').value;
  const pmensalFilter = document.getElementById('plaq-filter-pmensal').value;

  const rows = document.querySelectorAll('#table-plaq tbody tr');
  let visible = 0;
  rows.forEach(tr => {
    const text = tr.textContent.toLowerCase();
    let show = !search || text.includes(search);
    if (show && statusFilter) show = tr.dataset.status === statusFilter;

    if (show && ptotalFilter) show = tr.dataset.ptotal === ptotalFilter;
    if (show && pmensalFilter) {
      const pmensal = tr.dataset.pmensal || '';
      if (pmensalFilter === '—') show = pmensal === '—';
      else show = pmensal.split(',').includes(pmensalFilter);
    }
    tr.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  document.getElementById('count-plaq').textContent = `${visible} alunos`;
}

// ========== EXPORT ==========
function exportData() {
  const wb = XLSX.utils.book_new();

  if (STATE.summit.length) {
    const ws1 = XLSX.utils.json_to_sheet(STATE.summit.map((p,i) => ({
      '#': i+1, Nome: p.nome, Email: p.email, Telefone: p.telefone,
      Segmento: p.segmento, Programa: p.programa, Tier: p.tierMax,
      Categorias: p.categorias, Origem: p.origem
    })));
    XLSX.utils.book_append_sheet(wb, ws1, 'Summit');
  }

  if (STATE.mansao.length) {
    const ws2 = XLSX.utils.json_to_sheet(STATE.mansao.map((p,i) => ({
      '#': i+1, Nome: p.nome, Email: p.email, Telefone: p.telefone,
      Segmento: p.segmento, Programa: p.programa, Tier: p.tier,
      'Presença Summit': p.presenca_summit, Convidados: p.convidados, Origem: p.origem
    })));
    XLSX.utils.book_append_sheet(wb, ws2, 'Mansão');
  }

  // Plaquinhas
  const plaqData = STATE.summit.filter(p=>p.segmento==='Aluno').map((p,i) => {
    const plaq = STATE.plaquinhas[p.email] || {};
    return {
      '#': i+1, Nome: p.nome, Email: p.email, Programa: p.programa,
      Tier: p.tierMax,
      'Extratos': (plaq.extratos || []).length,
      'Bancos': (plaq.extratos || []).map(e=>e.banco).join(', ') || '—',
      'Fat. Total': plaq.fat_total || 0,
      'Plaq. Total': plaq.plaq_total || '—',
      'Maior Mês': plaq.fat_maior_mes || 0,
      'Plaq. Mensal': (plaq.plaq_mensal_labels || []).join(' + ') || '—',
      'Qtd Plaq. Mensais': plaq.qtd_plaquinhas_mensais || 0
    };
  });
  if (plaqData.length) {
    const ws3 = XLSX.utils.json_to_sheet(plaqData);
    XLSX.utils.book_append_sheet(wb, ws3, 'Plaquinhas');
  }

  XLSX.writeFile(wb, 'Summit_NSF_2026_Export.xlsx');
  toast('Exportado com sucesso!');
}

// filterPlaq is now standalone — no override needed
