<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Expires" content="0">
<title>Summit NSF 2026 — Gestão de Participantes</title>

<style>
:root {
  --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
  --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  --accent: #6366f1; --accent2: #818cf8;
  --green: #22c55e; --yellow: #eab308; --red: #ef4444; --purple: #a855f7;
  --border: #334155;
  --radius: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

/* LOGIN */
.login-overlay { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:9999; }
.login-box { background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:48px 40px; width:380px; text-align:center; }
.login-box h1 { font-size:24px; margin-bottom:8px; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.login-box p { color:var(--text2); font-size:13px; margin-bottom:32px; }
.login-box input { width:100%; padding:12px 16px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:15px; outline:none; margin-bottom:16px; text-align:center; letter-spacing:2px; }
.login-box input:focus { border-color:var(--accent); }
.login-box button { width:100%; padding:12px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius); font-size:15px; font-weight:600; cursor:pointer; }
.login-box button:hover { background:var(--accent2); }
.login-error { color:var(--red); font-size:13px; margin-top:8px; display:none; }

/* LAYOUT */
.app { display:none; }
.topbar { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.topbar h1 { font-size:18px; font-weight:700; }
.topbar h1 span { color:var(--accent2); }
.topbar-actions { display:flex; gap:8px; align-items:center; }
.topbar-actions button, .topbar-actions label { padding:8px 16px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; }
.topbar-actions button:hover, .topbar-actions label:hover { border-color:var(--accent); }
.topbar-actions input[type=file] { display:none; }

/* TABS */
.tabs { display:flex; background:var(--bg2); border-bottom:1px solid var(--border); padding:0 24px; gap:0; }
.tab { padding:12px 24px; font-size:14px; font-weight:500; color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; }
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent2); border-bottom-color:var(--accent); }

/* CONTENT */
.content { padding:24px; }
.panel { display:none; }
.panel.active { display:block; }

/* DASHBOARD */
.dash-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.dash-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:20px; position:relative; overflow:hidden; }
.dash-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
.dash-card.purple::before { background:var(--accent); }
.dash-card.green::before { background:var(--green); }
.dash-card.yellow::before { background:var(--yellow); }
.dash-card.red::before { background:var(--red); }
.dash-card .number { font-size:36px; font-weight:800; line-height:1.1; }
.dash-card.purple .number { color:var(--accent2); }
.dash-card.green .number { color:var(--green); }
.dash-card.yellow .number { color:var(--yellow); }
.dash-card.red .number { color:var(--red); }
.dash-card .label { font-size:12px; color:var(--text2); margin-top:4px; text-transform:uppercase; letter-spacing:.5px; }
.dash-card .sub { font-size:11px; color:var(--text3); margin-top:8px; }

.dash-row2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
.dash-section { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:20px; }
.dash-section h3 { font-size:14px; color:var(--text2); margin-bottom:12px; font-weight:600; }
.dash-bar { display:flex; height:28px; border-radius:6px; overflow:hidden; margin-bottom:8px; gap:2px; }
.dash-bar div { display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; min-width:30px; }
.dash-legend { display:flex; gap:16px; flex-wrap:wrap; }
.dash-legend span { font-size:11px; color:var(--text2); display:flex; align-items:center; gap:4px; }
.dash-legend span::before { content:''; width:10px; height:10px; border-radius:3px; display:inline-block; }

/* TABLE */
.table-controls { display:flex; gap:12px; margin-bottom:16px; align-items:center; flex-wrap:wrap; }
.table-controls input, .table-controls select { padding:8px 12px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:13px; outline:none; }
.table-controls input { width:280px; }
.table-controls input:focus, .table-controls select:focus { border-color:var(--accent); }
.table-controls .count { font-size:13px; color:var(--text2); margin-left:auto; }

.table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); max-height:calc(100vh - 280px); overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead { position:sticky; top:0; z-index:10; }
th { background:var(--bg3); color:var(--text); padding:10px 12px; text-align:left; font-weight:600; white-space:nowrap; border-bottom:2px solid var(--border); cursor:pointer; user-select:none; }
th:hover { background:#3b4f6b; }
th .sort-arrow { margin-left:4px; font-size:10px; color:var(--text3); }
td { padding:8px 12px; border-bottom:1px solid rgba(51,65,85,.5); white-space:nowrap; }
tr:hover td { background:rgba(99,102,241,.08); }
tr.row-aluno td { }
tr.row-externo td { color:#fbbf24; }
tr.row-outro td { color:#34d399; }

.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.badge-sim { background:rgba(34,197,94,.15); color:var(--green); }
.badge-nao { background:rgba(239,68,68,.15); color:var(--red); }
.badge-premium { background:rgba(168,85,247,.15); color:var(--purple); }
.badge-black { background:rgba(255,255,255,.1); color:var(--text); }
.badge-silver { background:rgba(148,163,184,.15); color:var(--text2); }

/* PLAQUINHAS */
.plaq-select { padding:4px 8px; background:var(--bg); border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:12px; cursor:pointer; }
.plaq-check { width:18px; height:18px; cursor:pointer; accent-color:var(--accent); }

/* MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:500; display:flex; align-items:center; justify-content:center; }
.modal { background:var(--bg2); border:1px solid var(--border); border-radius:16px; width:90%; max-width:800px; max-height:85vh; overflow-y:auto; padding:28px; }
.modal h2 { font-size:18px; margin-bottom:4px; }
.modal h3 { font-size:14px; color:var(--text2); margin:16px 0 8px; font-weight:600; }
.modal .close-btn { float:right; background:none; border:none; color:var(--text2); font-size:20px; cursor:pointer; padding:4px 8px; }
.modal .close-btn:hover { color:var(--text); }
.modal-actions { display:flex; gap:8px; margin-top:20px; justify-content:flex-end; }
.modal-actions button { padding:10px 20px; border-radius:var(--radius); font-size:14px; font-weight:600; cursor:pointer; border:1px solid var(--border); }
.modal-actions .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.modal-actions .btn-primary:hover { background:var(--accent2); }
.modal-actions .btn-secondary { background:var(--bg3); color:var(--text); }
.month-input-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.month-input-item { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px; }
.month-input-item label { font-size:11px; color:var(--text2); display:block; margin-bottom:4px; }
.month-input-item input { width:100%; padding:6px 8px; background:var(--bg2); border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:14px; text-align:right; font-variant-numeric:tabular-nums; }
.month-input-item input:focus { border-color:var(--accent); outline:none; }
.month-input-item .auto-badge { font-size:9px; color:var(--green); margin-left:4px; }
.pdf-status { padding:8px 12px; border-radius:6px; font-size:13px; margin:8px 0; }
.pdf-status.info { background:rgba(99,102,241,.1); color:var(--accent2); }
.pdf-status.warn { background:rgba(234,179,8,.1); color:var(--yellow); }
.pdf-status.err { background:rgba(239,68,68,.1); color:var(--red); }
.extrato-chip { display:inline-flex; align-items:center; gap:4px; background:rgba(99,102,241,.12); color:var(--accent2); padding:3px 8px; border-radius:4px; font-size:11px; margin:2px; }
.extrato-chip .remove-btn { cursor:pointer; color:var(--red); font-weight:700; margin-left:2px; }
.extrato-chip .remove-btn:hover { color:#ff6b6b; }

/* TOAST */
.toast { position:fixed; bottom:24px; right:24px; background:var(--green); color:#fff; padding:12px 20px; border-radius:var(--radius); font-size:14px; font-weight:500; z-index:999; display:none; animation:fadeIn .3s; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* RESPONSIVE */
@media(max-width:900px) {
  .dash-grid { grid-template-columns:repeat(2,1fr); }
  .dash-row2 { grid-template-columns:1fr; }
}
@media(max-width:600px) {
  .dash-grid { grid-template-columns:1fr; }
  .tabs { overflow-x:auto; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h1>Summit NSF 2026</h1>
    <p>Gestão de Participantes</p>
    <input type="password" id="pwdInput" placeholder="Senha de acesso" autofocus>
    <button onclick="doLogin()">Entrar</button>
    <div class="login-error" id="loginError">Senha incorreta</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <h1>Summit <span>NSF 2026</span> <span style="font-size:12px;color:#ff6;font-weight:700">v15</span></h1>
    <div class="topbar-actions">
      <label title="Upload BC Summit (.csv)">
        📋 BC Summit
        <input type="file" accept=".csv" onchange="handleUpload(this,'bc_summit')">
      </label>
      <label title="Upload Sympla Summit (.csv ou .xlsx)">
        🎟 Sympla Summit
        <input type="file" accept=".csv,.xlsx" onchange="handleUpload(this,'sympla_summit')">
      </label>
      <label title="Upload BC Mansão (.csv)">
        🏠 BC Mansão
        <input type="file" accept=".csv" onchange="handleUpload(this,'bc_mansao')">
      </label>
      <label title="Upload Sympla Mansão (.csv ou .xlsx)">
        🏠 Sympla Mansão
        <input type="file" accept=".csv,.xlsx" onchange="handleUpload(this,'sympla_mansao')">
      </label>
      <label title="Upload Alunos Ativos (.csv)">
        👥 Alunos Ativos
        <input type="file" accept=".csv" onchange="handleUpload(this,'alunos')">
      </label>
      <!-- Comprovantes agora são PDFs por aluno na aba Plaquinhas -->
      <button onclick="exportData()">⬇ Exportar</button>
      <button onclick="logout()" style="background:transparent;border-color:var(--red);color:var(--red)">Sair</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="dashboard">Dashboard</div>
    <div class="tab" data-tab="summit">Summit</div>
    <div class="tab" data-tab="mansao">Mansão</div>
    <div class="tab" data-tab="plaquinhas">Plaquinhas</div>
    <div class="tab" data-tab="logistica">Logística Plaquinhas</div>
    <div class="tab" data-tab="metas">Metas</div>
  </div>

  <div class="content">
    <!-- DASHBOARD -->
    <div class="panel active" id="panel-dashboard"></div>
    <!-- SUMMIT -->
    <div class="panel" id="panel-summit"></div>
    <!-- MANSÃO -->
    <div class="panel" id="panel-mansao"></div>
    <!-- PLAQUINHAS -->
    <div class="panel" id="panel-plaquinhas"></div>
    <!-- LOGÍSTICA PLAQUINHAS -->
    <div class="panel" id="panel-logistica"></div>
    <div class="panel" id="panel-metas"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== CONFIG ==========
const PASS_HASH = 'b030874bb571318491614fc6eaded526837b8d0eeb3364f3c7ac8f7a549b3237'; // senha: summit2026

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ========== FIREBASE ==========
const firebaseConfig = {
  apiKey: "AIzaSyC-A-wkGIigLLSJtJJNYpyzMVi1nqcsw0E",
  authDomain: "summit-nsf-2026.firebaseapp.com",
  databaseURL: "https://summit-nsf-2026-default-rtdb.firebaseio.com",
  projectId: "summit-nsf-2026",
  storageBucket: "summit-nsf-2026.firebasestorage.app",
  messagingSenderId: "591774273255",
  appId: "1:591774273255:web:f8c11f2403cf2c5dffdc42"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let firebaseReady = false;
let isSyncingFromFirebase = false; // prevent write loops
let lastStateSaveTime = 0; // timestamp to debounce Firebase listener echoes
let lastRawSaveTime = 0;

// ========== STATE ==========
let STATE = {
  summit: [],    // pessoas summit
  mansao: [],    // pessoas mansão
  plaquinhas: {}, // email -> { comprovante: bool, tipo: string }
  alunos_manuais: [] // alunos adicionados manualmente na aba plaquinhas
};

// Firebase key sanitization: dots/special chars are illegal in Firebase keys
function fbEncode(key) { return key.replace(/\./g, '%2E').replace(/#/g, '%23').replace(/\$/g, '%24').replace(/\[/g, '%5B').replace(/\]/g, '%5D').replace(/\//g, '%2F'); }
function fbDecode(key) { return key.replace(/%2E/g, '.').replace(/%23/g, '#').replace(/%24/g, '$').replace(/%5B/g, '[').replace(/%5D/g, ']').replace(/%2F/g, '/'); }

function firebaseSafeState() {
  // Clone STATE but encode plaquinhas keys for Firebase compatibility
  const safe = JSON.parse(JSON.stringify(STATE));
  const encodedPlaq = {};
  for (const [email, data] of Object.entries(safe.plaquinhas || {})) {
    encodedPlaq[fbEncode(email)] = data;
  }
  safe.plaquinhas = encodedPlaq;
  return safe;
}

function decodeFirebasePlaquinhas(plaqObj) {
  // Decode Firebase keys back to real email addresses
  const decoded = {};
  for (const [key, data] of Object.entries(plaqObj || {})) {
    decoded[fbDecode(key)] = data;
  }
  return decoded;
}

function saveState(waitForFirebase = false) {
  // Local cache (always synchronous — immediate, uses real email keys)
  try { localStorage.setItem('summit_nsf_2026', JSON.stringify(STATE)); } catch(e) {}
  // Firebase (encode keys)
  if (firebaseReady && !isSyncingFromFirebase) {
    lastStateSaveTime = Date.now();
    const safeState = firebaseSafeState();
    const p = db.ref('state').set(safeState).then(() => {
      console.log('STATE salvo no Firebase');
    }).catch(e => { console.warn('Erro Firebase STATE:', e); });
    if (waitForFirebase) return p;
  }
  return Promise.resolve();
}
function loadState() {
  try {
    const s = localStorage.getItem('summit_nsf_2026');
    if (s) { STATE = JSON.parse(s); return true; }
  } catch(e) { console.warn('Erro ao carregar STATE:', e); }
  return false;
}

function saveRaw() {
  // Local cache
  try {
    localStorage.setItem('summit_nsf_raw', JSON.stringify(RAW));
    console.log('RAW salvo:', Object.entries(RAW).map(([k,v])=>`${k}:${v.length}`).join(', '));
  } catch(e) {
    console.warn('Erro ao salvar RAW (localStorage cheio):', e);
    try {
      const lite = {...RAW};
      delete lite.sympla_summit;
      delete lite.sympla_mansao;
      localStorage.setItem('summit_nsf_raw', JSON.stringify(lite));
    } catch(e2) {}
  }
  // Firebase
  if (firebaseReady && !isSyncingFromFirebase) {
    lastRawSaveTime = Date.now();
    db.ref('raw').set(RAW).then(() => {
      console.log('RAW salvo no Firebase');
    }).catch(e => { console.warn('Erro Firebase RAW:', e); });
  }
}
function loadRaw() {
  try {
    const s = localStorage.getItem('summit_nsf_raw');
    if (s) {
      RAW = JSON.parse(s);
      console.log('RAW restaurado:', Object.entries(RAW).map(([k,v])=>`${k}:${v.length}`).join(', '));
      return true;
    }
  } catch(e) { console.warn('Erro ao carregar RAW:', e); }
  return false;
}

// Firebase sync — RAW uses real-time listener; STATE loads once (no listener to avoid overwrites)
function setupFirebaseListeners() {
  // RAW: real-time sync (safe — only uploads trigger writes, no race condition)
  db.ref('raw').on('value', snap => {
    const data = snap.val();
    if (!data) return;
    const elapsed = Date.now() - lastRawSaveTime;
    if (elapsed < 5000) { console.log(`[Firebase RAW listener] Ignorando — ${elapsed}ms desde último save`); return; }
    // Preserve local RAW arrays that are larger than Firebase (prevents sync regression)
    const mergedRaw = {
      bc_summit: (data.bc_summit || []).length >= (RAW.bc_summit || []).length ? (data.bc_summit || []) : RAW.bc_summit,
      sympla_summit: (data.sympla_summit || []).length >= (RAW.sympla_summit || []).length ? (data.sympla_summit || []) : RAW.sympla_summit,
      bc_mansao: (data.bc_mansao || []).length >= (RAW.bc_mansao || []).length ? (data.bc_mansao || []) : RAW.bc_mansao,
      sympla_mansao: (data.sympla_mansao || []).length >= (RAW.sympla_mansao || []).length ? (data.sympla_mansao || []) : RAW.sympla_mansao,
      alunos: (data.alunos || []).length >= (RAW.alunos || []).length ? (data.alunos || []) : RAW.alunos,
      comprovantes: (data.comprovantes || []).length >= (RAW.comprovantes || []).length ? (data.comprovantes || []) : RAW.comprovantes,
    };
    isSyncingFromFirebase = true;
    RAW = mergedRaw;
    try { localStorage.setItem('summit_nsf_raw', JSON.stringify(RAW)); } catch(e) {}
    console.log('RAW sincronizado do Firebase:', Object.entries(RAW).map(([k,v])=>`${k}:${v.length}`).join(', '));
    const hasAnySummit = RAW.bc_summit.length > 0 || RAW.sympla_summit.length > 0;
    const hasAnyMansao = RAW.bc_mansao.length > 0 || RAW.sympla_mansao.length > 0;
    if (hasAnySummit) rebuildSummit();
    if (hasAnyMansao) rebuildMansao();
    isSyncingFromFirebase = false;
  });

  // STATE/plaquinhas: load ONCE from Firebase (no real-time listener)
  // This prevents the listener from overwriting local saves with stale data
  db.ref('state').once('value', snap => {
    const data = snap.val();
    if (data && data.plaquinhas) {
      // Only load from Firebase if local state is empty (first load)
      const localHasData = Object.keys(STATE.plaquinhas || {}).length > 0;
      if (!localHasData) {
        STATE.plaquinhas = decodeFirebasePlaquinhas(data.plaquinhas);
        try { localStorage.setItem('summit_nsf_2026', JSON.stringify(STATE)); } catch(e) {}
        recalcAllPlaquinhas();
        renderAll();
        console.log('Plaquinhas carregadas do Firebase (carga inicial)');
      } else {
        console.log('Plaquinhas locais já existem, mantendo estado local');
      }
    }
  });

  firebaseReady = true;
  console.log('Firebase listeners ativos');
}

// ========== LOGIN ==========
async function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  const hash = await sha256(pwd);
  if (hash === PASS_HASH) {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('summit_auth', '1');
    initData();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}
document.getElementById('pwdInput').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function logout() {
  sessionStorage.removeItem('summit_auth');
  location.reload();
}

// Recalcular plaquinhas de todos os alunos a partir de STATE.plaquinhas[email].extratos
function recalcAllPlaquinhas() {
  // Recalcular todos os alunos que têm plaquinhas entry
  for (const email of Object.keys(STATE.plaquinhas)) {
    recalcAlunoPlaquinhas(email);
  }

  // Garantir que alunos com histórico de fat. total mas sem entry ainda recebam o garantido
  if (typeof PLAQ_HISTORY !== 'undefined') {
    const alunosSummit = STATE.summit || [];
    for (const aluno of alunosSummit) {
      if (aluno.segmento !== 'Aluno') continue;
      if (STATE.plaquinhas[aluno.email]) continue; // já processado
      const garantido = getGuaranteedFatTotal(aluno.nome);
      if (garantido > 0) {
        STATE.plaquinhas[aluno.email] = {
          nome: aluno.nome,
          extratos: [],
          meses: {},
          fat_garantido: garantido,
          fat_manual: 0,
          fat_total: garantido,
          fat_maior_mes: 0,
          plaq_total: classifyPlaquinhaTotal(garantido)?.label || '—',
          plaq_mensais: [],
          plaq_mensal_labels: [],
          plaq_mensal: '—',
          qtd_plaquinhas_mensais: 0
        };
      }
    }
  }
  saveState();
}

      try {
        const localStr = localStorage.getItem('summit_nsf_2026');
        if (localStr) {
          const localState = JSON.parse(localStr);
          if (localState.plaquinhas) {
            for (const [email, localPlaq] of Object.entries(localState.plaquinhas)) {
              const fbPlaq = STATE.plaquinhas[email];

        }
      } catch(e) { console.warn('Erro merge localStorage:', e); }

      try { localStorage.setItem('summit_nsf_2026', JSON.stringify(STATE)); } catch(e) {}
    }

    // Setup real-time sync
    setupFirebaseListeners();

    if (rawData) {
      const hasAnySummit = RAW.bc_summit.length > 0 || RAW.sympla_summit.length > 0;
      const hasAnyMansao = RAW.bc_mansao.length > 0 || RAW.sympla_mansao.length > 0;

      if (hasAnySummit) rebuildSummit();
      if (hasAnyMansao) rebuildMansao();
      recalcAllPlaquinhas();
      isSyncingFromFirebase = false;
      if (!hasAnySummit && !hasAnyMansao) renderAll();
      const parts = [];
      if (RAW.bc_summit.length) parts.push(`BC Summit: ${RAW.bc_summit.length}`);
      if (RAW.sympla_summit.length) parts.push(`Sympla Summit: ${RAW.sympla_summit.length}`);
      if (RAW.bc_mansao.length) parts.push(`BC Mansão: ${RAW.bc_mansao.length}`);
      if (RAW.sympla_mansao.length) parts.push(`Sympla Mansão: ${RAW.sympla_mansao.length}`);
      if (RAW.alunos.length) parts.push(`Alunos: ${RAW.alunos.length}`);
      const plaqCount = Object.values(STATE.plaquinhas).filter(p=>p.extratos?.length).length;
      if (plaqCount) parts.push(`Extratos: ${plaqCount} alunos`);
      if (parts.length) toast('🔄 Dados sincronizados: ' + parts.join(' · '));
      else toast('Conectado — nenhum dado no servidor ainda');
    } else {
      // No data in Firebase, try localStorage fallback
      loadState();
      const hasRaw = loadRaw();
      setupFirebaseListeners();
      if (hasRaw) {
        const hasAnySummit = RAW.bc_summit.length > 0 || RAW.sympla_summit.length > 0;
        const hasAnyMansao = RAW.bc_mansao.length > 0 || RAW.sympla_mansao.length > 0;

        if (hasAnyMansao) rebuildMansao();
        recalcAllPlaquinhas();
        if (!hasAnySummit && !hasAnyMansao) renderAll();
        toast('Dados restaurados do cache local');
      } else {
        renderAll();
        toast('Sistema pronto — faça upload dos dados');
      }
    }
  } catch(e) {
    console.warn('Firebase indisponível, usando localStorage:', e);
    loadState();
    const hasRaw = loadRaw();
    if (hasRaw) {
      const hasAnySummit = RAW.bc_summit.length > 0 || RAW.sympla_summit.length > 0;
      const hasAnyMansao = RAW.bc_mansao.length > 0 || RAW.sympla_mansao.length > 0;

      if (hasAnyMansao) rebuildMansao();
      recalcAllPlaquinhas();
      if (!hasAnySummit && !hasAnyMansao) renderAll();
      toast('⚠ Modo offline — dados do cache local');
    } else {
      renderAll();
    }
  }
}

// ========== UPLOAD HANDLERS ==========
function handleUpload(input, type) {
  const file = input.files[0];
  if (!file) return;
  const isXlsx = file.name.toLowerCase().endsWith('.xlsx');
  const isSympla = (type === 'sympla_summit' || type === 'sympla_mansao');
  const reader = new FileReader();

  if (isSympla && !isXlsx) {
    // CSV path for Sympla — dedicated parser handles header rows + semicolon
    reader.onload = (e) => {
      const text = e.target.result;
      if (text.length < 50) { toast('Erro: arquivo CSV vazio'); return; }
      if (type === 'sympla_summit') processSymplaCSV(text, 'summit');
      else processSymplaCSV(text, 'mansao');
    };
    reader.readAsText(file, 'utf-8');
  } else if (isSympla && isXlsx) {
    // XLSX path for Sympla — with fallback detection
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array', cellDates:false, raw:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const ref = ws['!ref'] || '';
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true, blankrows:true});
        console.log(`[${type}] XLSX Ref: ${ref}, Rows: ${rows.length}`);

        // Detect single-column bug: if SheetJS reads ≤1 column, the file is incompatible
        const range = XLSX.utils.decode_range(ref);
        const numCols = range.e.c - range.s.c + 1;
        if (numCols <= 1) {
          toast('⚠ Formato XLSX incompatível. Exporte o arquivo do Sympla como CSV e tente novamente.');
          console.warn('SheetJS leu apenas 1 coluna — arquivo Sympla com formato incompatível. Use CSV.');
          return;
        }

        if (rows.length < 5) { toast(`Erro: planilha vazia (${rows.length} linhas)`); return; }
        if (type === 'sympla_summit') processSymplaSummit(rows);
        else processSymplaMansao(rows);
      } catch(err) {
        console.error('Erro ao ler XLSX:', err);
        toast('Erro ao ler XLSX. Tente exportar como CSV no Sympla.');
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    // CSV path for BC / Alunos / Comprovantes
    reader.onload = (e) => {
      const text = e.target.result;
      if (type === 'bc_summit') processBCSummit(text);
      else if (type === 'bc_mansao') processBCMansao(text);
      else if (type === 'alunos') processAlunos(text);
    };
    reader.readAsText(file, 'utf-8');
  }
  input.value = '';
}

function parseCSV(text, delim=',') {
  // Strip BOM (UTF-8 BOM decoded to U+FEFF in JS strings) and normalize line endings
  text = text.replace(/^﻿/, '').replace(/^\xEF\xBB\xBF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  if (!text.trim()) return [];

  // Detect delimiter from first line
  const firstNewline = text.indexOf('\n');
  const firstLine = firstNewline > 0 ? text.substring(0, firstNewline) : text;
  if (firstLine.includes(';') && !firstLine.includes(',')) delim = ';';

  // Parse all records handling multi-line quoted fields
  const records = parseCSVRecords(text, delim);
  if (records.length < 2) return [];

  const headers = records[0].map(h => h.trim());
  return records.slice(1).filter(r => r.length > 1 || (r.length === 1 && r[0].trim())).map(vals => {
    const obj = {};
    headers.forEach((h, i) => { if (h) obj[h] = (vals[i] || '').trim(); });
    return obj;
  });
}

// Parse CSV text into array of arrays, correctly handling quoted fields with newlines
function parseCSVRecords(text, delim) {
  const records = [];
  let current = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];

    if (inQuotes) {
      if (ch === '"') {
        if (i + 1 < text.length && text[i + 1] === '"') {
          field += '"'; // escaped quote
          i++;
        } else {
          inQuotes = false; // end of quoted field
        }
      } else {
        field += ch; // include newlines inside quotes
      }
    } else {
      if (ch === '"') {
        inQuotes = true;
      } else if (ch === delim) {
        current.push(field);
        field = '';
      } else if (ch === '\n') {
        current.push(field);
        field = '';
        records.push(current);
        current = [];
      } else {
        field += ch;
      }
    }
  }
  // Last field/record
  if (field || current.length) {
    current.push(field);
    records.push(current);
  }
  return records;
}

function ne(s) { return (s||'').trim().toLowerCase(); }

// Parse Sympla CSV — handles institutional header rows + semicolon delimiter
function parseSymplaCSV(text) {
  // Sympla CSV: BOM + 7 header lines (event name, date, venue, blanks) + real headers + data
  // Delimiter: semicolon (;)
  text = text.replace(/^﻿/, '').replace(/^\xEF\xBB\xBF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = text.split('\n');

  // Find the real header row: contains both "Ordem" and "Email"
  let headerIdx = -1;
  for (let i = 0; i < Math.min(lines.length, 20); i++) {
    if (lines[i].includes('Ordem') && lines[i].includes('Email')) {
      headerIdx = i;
      break;
    }
  }
  if (headerIdx === -1) {
    console.error('Sympla CSV: header row not found in first 20 lines');
    return [];
  }

  console.log(`Sympla CSV: header found at line ${headerIdx}`);

  // Use parseCSVRecords from headerIdx onwards (handles multi-line quoted fields)
  const dataText = lines.slice(headerIdx).join('\n');
  const records = parseCSVRecords(dataText, ';');
  if (records.length < 2) return [];

  const headers = records[0].map(h => h.trim());
  console.log(`Sympla CSV headers: ${headers.filter(h=>h).length} columns`);

  const rows = records.slice(1).filter(r => r.length > 1 || (r.length === 1 && r[0].trim())).map(vals => {
    const obj = {};
    headers.forEach((h, i) => { if (h) obj[h] = (vals[i] || '').trim(); });
    return obj;
  }).filter(obj => {
    const email = getField(obj, 'Email', 'email');
    return email && email.includes('@');
  });

  console.log(`Sympla CSV parsed: ${rows.length} valid rows`);
  return rows;
}

    const hasContent = r.some(c => c !== null && c !== undefined && String(c).trim() !== '');
    return hasContent;
  });

  RAW.sympla_summit = data.map(r => {
    const obj = {};
    headers.forEach((h,i) => {
      if (h) obj[h] = r[i] !== undefined && r[i] !== null ? String(r[i]).trim() : '';

    console.warn('ALERTA: Nenhum aprovado encontrado! Verificar nome da coluna de status.');

    toast(`Atenção: ${RAW.sympla_summit.length} linhas lidas mas 0 aprovados. Verifique o formato.`);
    return;
  }

  toast(`Sympla Summit: ${aprovados} aprovados, ${cancelados} cancelados`);

  rebuildSummit();

// Faturamento Total thresholds (descending, with tolerance applied)
const PLAQ_TOTAL_TIERS = [
  { label: '6M',   min: 5100000, icon: '🏆' },
  { label: '5M',   min: 4250000, icon: '🌈' },
  { label: '4M',   min: 3400000, icon: '💥' },

];

// Faturamento Mensal thresholds (descending, with tolerance applied)
const PLAQ_MENSAL_TIERS = [
  { label: '500K/mês', min: 450000, icon: '👑' },
  { label: '400K/mês', min: 360000, icon: '🏆' },
  { label: '300K/mês', min: 270000, icon: '💎' },
  { label: '200K/mês', min: 180000, icon: '🔥' },
  { label: '100K/mês', min: 90000,  icon: '🌟' },
  { label: '40K/mês',  min: 36000,  icon: '✨', display: '10K/semana (40K/mês)' },
];

function classifyPlaquinhaTotal(total) {
  for (const t of PLAQ_TOTAL_TIERS) {
    if (total >= t.min) return t;
  }
  return null;
}

function classifyPlaquinhaMensal(valor) {
  for (const t of PLAQ_MENSAL_TIERS) {
    if (valor >= t.min) return t;
  }
  return null;
}

// Regra de Acúmulo: retorna todos os tiers DISTINTOS atingidos em meses diferentes
function classifyPlaquinhasMensaisAcumulo(byMonth) {
  const achievedTiers = new Map(); // label -> {tier, months:[], value}
  for (const [month, value] of Object.entries(byMonth)) {
    // Para cada mês, registrar TODOS os tiers que o valor atinge (não só o maior)
    for (const tier of PLAQ_MENSAL_TIERS) {
      if (value >= tier.min) {
        if (!achievedTiers.has(tier.label)) {
          achievedTiers.set(tier.label, { tier, months: [], value: 0 });
        }
        const entry = achievedTiers.get(tier.label);
        entry.months.push(month);
        if (value > entry.value) entry.value = value;
      }
    }
  }
  // Retorna array de tiers distintos (ordenados do maior para menor)
  const result = [...achievedTiers.values()].sort((a, b) => b.tier.min - a.tier.min);
  return result;
}

async function extractPDFText(file) {
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: ab}).promise;
  let fullText = '';
  for (let i = 1; i <= pdf.numPages; i++) {

    const lines = [];

    let currentLine = '';
    tc.items.forEach(item => {
      const y = Math.round(item.transform[5]);
      if (lastY !== null && Math.abs(y - lastY) > 3) {
        lines.push(currentLine);
        currentLine = '';
      }
      currentLine += (currentLine ? ' ' : '') + item.str;
      lastY = y;
    });
    if (currentLine) lines.push(currentLine);
    fullText += lines.join('\n') + '\n';
  }

  // If very little text extracted, try OCR on rendered pages
  const cleanText = fullText.replace(/\s+/g, '').trim();
  if (cleanText.length < 30) {
    console.log('PDF text too short, falling back to OCR...');
    fullText = await ocrPDFPages(pdf);
  }

  return fullText;
}

async function ocrPDFPages(pdf) {
  let fullText = '';
  const worker = await Tesseract.createWorker('por');
  try {
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 2.0 }); // Higher scale = better OCR
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
      const { data } = await worker.recognize(canvas);
      fullText += data.text + '\n';
    }
  } finally {
    await worker.terminate();
  }
  return fullText;
}

async function preprocessImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const scale = Math.max(1.5, 3000 / Math.max(img.width, img.height));
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imageData.data;
      let darkPixels = 0;
      const total = d.length / 4;
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        if (gray < 100) darkPixels++;
      }
      const isDark = darkPixels > total * 0.5;
      for (let i = 0; i < d.length; i += 4) {
        let gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        if (isDark) gray = 255 - gray;
        d[i] = d[i+1] = d[i+2] = Math.max(0, Math.min(255, gray));
      }
      ctx.putImageData(imageData, 0, 0);
      canvas.toBlob(blob => resolve(blob), 'image/png');
    };
    img.src = URL.createObjectURL(file);
  });
}

async function extractImageText(file) {
  const worker = await Tesseract.createWorker('por');
  try {
    // Pass 1: preprocessed (upscaled, grayscale, inverted if dark)
    const processed = await preprocessImage(file);
    const { data: d1 } = await worker.recognize(processed);
    // Pass 2: raw image
    const { data: d2 } = await worker.recognize(file);
    const countUseful = (t) => {
      const rCount = (t.match(/R\s*\$\s*[\d.,]+/g) || []).length;
      const dateCount = (t.match(/\d{2}\s*[\/\-]\s*\d{2}\s*[\/\-]\s*\d{4}/g) || []).length;
      const wordCount = (t.match(/[A-Za-zÀ-ú]{4,}/g) || []).length;
      return rCount * 10 + dateCount * 5 + wordCount;
    };
    const s1 = countUseful(d1.text), s2 = countUseful(d2.text);
    console.log('[OCR] processed score:', s1, '| raw score:', s2);
    const best = s1 >= s2 ? d1.text : d2.text;
    console.log('[OCR] text:', best.substring(0, 500));
    return best;
  } finally {
    await worker.terminate();
  }
}

  // 2. Check if it's a payment receipt (comprovante) — Pix, Asaas, etc.

  const isComprovante = /Comprovante\s+de\s+(pagamento|transfer[êe]ncia)/i.test(text) ||
                        /Valor\s+pago.*Data\s+da\s+confirma/is.test(text) ||

                        /Comprovante\s+(do\s+)?Pix/i.test(text) ||

                        /seu\s+pagamento.*foi\s+(realizado|confirmado|efetuado)/is.test(text);

  if (isComprovante) {
    let banco = 'Comprovante';
    if (/Asaas|asaas\.com/i.test(text)) banco = 'Asaas';

  }

  // 3. Bank statement detection
  let banco = 'Desconhecido';
  if (/nubank|Nu\s+Financeira|Nu\s+Pagamentos/i.test(text)) banco = 'Nubank';
  else if (/ITA[ÚU]|itau\.com/i.test(text)) banco = 'Itaú';
  else if (/BRADESCO|bradesco\.com/i.test(text)) banco = 'Bradesco';
  else if (/SANTANDER|santander\.com/i.test(text)) banco = 'Santander';

  else if (/CAIXA\s+ECON|caixa\.gov/i.test(text)) banco = 'Caixa';
  else if (/BANCO\s+DO\s+BRASIL|bb\.com/i.test(text)) banco = 'BB';
  else if (/SICOOB/i.test(text)) banco = 'Sicoob';
  else if (/C6\s+BANK|C6\s+S\.?A/i.test(text)) banco = 'C6 Bank';
  else if (/InfinitePay|CLOUDWALK|infinitepay/i.test(text)) banco = 'InfinitiPay';
  else if (/Sicredi/i.test(text)) banco = 'Sicredi';
  else if (/Unicred/i.test(text)) banco = 'Unicredi';
  else if (/PagBank|PagSeguro/i.test(text)) banco = 'PagBank';
  else if (/Mercado\s*Pago/i.test(text)) banco = 'MercadoPago';
  else if (/Stone/i.test(text)) banco = 'Stone';
  else if (/Rede\b/i.test(text)) banco = 'Rede';
  else if (/Cielo/i.test(text)) banco = 'Cielo';
  else if (/Safra/i.test(text)) banco = 'Safra';
  else if (/Original/i.test(text)) banco = 'Original';
  else if (/BRB|Banco\s+de\s+Bras[ií]lia/i.test(text)) banco = 'BRB';
  else if (/Banrisul/i.test(text)) banco = 'Banrisul';
  else if (/Cresol/i.test(text)) banco = 'Cresol';
  else if (/Asaas/i.test(text)) banco = 'Asaas';
  else if (/iFood/i.test(text)) banco = 'iFood';
  else if (/ZOOP/i.test(text)) banco = 'Zoop';

  // Detect period
  let periodo = '';
  const periodMatch = text.match(/(\d{2})\s+DE\s+(\w+)\s+DE\s+(\d{4})\s+a\s+(\d{2})\s+DE\s+(\w+)\s+DE\s+(\d{4})/i);
  if (periodMatch) {
    periodo = `${periodMatch[1]}/${periodMatch[2]}/${periodMatch[3]} a ${periodMatch[4]}/${periodMatch[5]}/${periodMatch[6]}`;
  }
  const periodMatch2 = text.match(/(\d{2})\/(\d{2})\/(\d{4})\s+a\s+(\d{2})\/(\d{2})\/(\d{4})/);
  if (!periodo && periodMatch2) {
    periodo = `${periodMatch2[1]}/${periodMatch2[2]}/${periodMatch2[3]} a ${periodMatch2[4]}/${periodMatch2[5]}/${periodMatch2[6]}`;
  }

  // Parse monthly entradas
  let monthlyEntradas = {};

  if (banco === 'Nubank') {
    monthlyEntradas = parseNubank(text);
  } else {
    monthlyEntradas = parseNubank(text);
    if (Object.keys(monthlyEntradas.entradas || {}).length === 0) {

  return {

    total_liquido: monthlyEntradas.total_liquido || 0,
    warnings: monthlyEntradas.warnings || []
  };
}

function parseNubank(text) {
  const lines = text.split('\n');
  const entradas = {};    // YYYY-MM -> value (bruto)
  const non_revenue = {};  // YYYY-MM -> value
  let currentMonth = null;
  let inEntradas = false;

  for (const line of lines) {
    // Detect date: "08 MAR 2025" or "13 MAR 2025"
    const dm = line.match(/^(\d{2})\s+(JAN|FEB|FEV|MAR|APR|ABR|MAY|MAI|JUN|JUL|AUG|AGO|SEP|SET|OCT|OUT|NOV|DEC|DEZ)\s+(\d{4})/);
    if (dm) {
      const mm = MONTH_MAP[dm[2]] || '00';
      currentMonth = `${dm[3]}-${mm}`;
    }

    // Detect "Total de entradas"
    const entradaMatch = line.match(/Total de entradas\s*\+?\s*([\d.,]+)/);
    if (entradaMatch && currentMonth) {
      const val = parseFloat(entradaMatch[1].replace(/\./g, '').replace(',', '.'));
      entradas[currentMonth] = (entradas[currentMonth] || 0) + val;
      inEntradas = true;
      continue;
    }

    if (/Total de sa[ií]das|Saldo do dia/.test(line)) {
      inEntradas = false;
      continue;
    }

    // In entradas section, detect non-revenue
    if (inEntradas && currentMonth) {
      for (const pattern of NON_REVENUE_PATTERNS) {
        if (line.includes(pattern)) {
          const valMatch = line.match(/([\d.]+,\d{2})\s*$/);
          if (valMatch) {
            const val = parseFloat(valMatch[1].replace(/\./g, '').replace(',', '.'));
            non_revenue[currentMonth] = (non_revenue[currentMonth] || 0) + val;
          }
        }
      }
    }
  }

  // Compute líquido
  const liquido = {};
  let total_bruto = 0, total_non_rev = 0;
  for (const m of Object.keys(entradas)) {
    const bruto = entradas[m];
    const nr = non_revenue[m] || 0;
    liquido[m] = bruto - nr;
    total_bruto += bruto;
    total_non_rev += nr;
  }

  const warnings = [];
  if (Object.keys(entradas).length === 0) warnings.push('Nenhuma entrada encontrada no formato Nubank');

  return { entradas, non_revenue, liquido, total_bruto, total_non_rev, total_liquido: total_bruto - total_non_rev, warnings };
}

function parseNFSe(text) {
  const entradas = {};
  let total = 0;
  const warnings = [];
  const details = [];
  let titular = '';

  // Extract titular (prestador de serviço)
  // Antigo: "Nome/Razão Social NOME AQUI"
  let tm = text.match(/Nome\/Raz[ãa]o\s+Social\s+([A-ZÀ-Ú][A-ZÀ-Ú\s]+(?:LTDA|ME|EIRELI|S\.?A\.?)?)/i);
  // Novo DANFSe: "Nome/NomeEmpresarial E-mail\nNOMESEMESPACO EMAIL"
  if (!tm) tm = text.match(/Nome\/NomeEmpresarial\s+E-mail\s*\n?\s*([A-ZÀ-Ú][A-ZÀ-Úa-zà-ú]+(?:\s+\S+)?)/);
  if (tm) titular = tm[1].trim();
  // Also try CNPJ
  const cnpjMatch = text.match(/(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/);
  if (cnpjMatch) titular = (titular ? titular + ' ' : '') + '(CNPJ ' + cnpjMatch[1] + ')';

  // Find date (competência)
  let dateMatch = text.match(/Compet[êe]ncia(?:daNFS-e)?\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  if (!dateMatch) dateMatch = text.match(/Data\s*(?:de\s*)?[Ee]miss[ãa]o\s*(?:daNFS-e)?\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  if (!dateMatch) {
    // Fallback: first date in text
    dateMatch = text.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  }

  // Find value (may be on different line from label in DANFSe format)
  let valor = 0;
  // Try "Valor dos serviços = R$ X.XXX,XX" (antigo, same line)
  let valMatch = text.match(/Valor\s+dos?\s+servi[çc]os?\s*=?\s*R\$\s*([\d.,]+)/i);
  // Try "ValordoServiço" then R$ on same or next line (novo DANFSe)
  if (!valMatch) valMatch = text.match(/ValordoServi[çc]o[\s\S]*?R\$([\d.,]+)/i);
  // Try "Valor do Serviço" with spaces, cross-line
  if (!valMatch) valMatch = text.match(/Valor\s+do\s+Servi[çc]o[\s\S]*?R\$([\d.,]+)/i);
  // Try "ValorLíquidodaNFS-e" cross-line
  if (!valMatch) valMatch = text.match(/Valor\s*L[ií]quido\s*(?:da\s*)?NFS-?e[\s\S]*?R\$([\d.,]+)/i);
  if (!valMatch) valMatch = text.match(/ValorL[ií]quidodaNFS-?e[\s\S]*?R\$([\d.,]+)/i);
  // Last resort: find "VALOR TOTAL DA NOTA" or similar
  if (!valMatch) valMatch = text.match(/VALOR\s*TOTAL[\s\S]*?R\$([\d.,]+)/i);

  if (valMatch) {
    valor = parseFloat(valMatch[1].replace(/\./g, '').replace(',', '.'));
  }

  if (dateMatch && valor > 0) {
    const dd = dateMatch[1], mm = dateMatch[2], yyyy = dateMatch[3];
    const monthKey = `${yyyy}-${mm}`;
    entradas[monthKey] = (entradas[monthKey] || 0) + valor;
    total += valor;
    details.push({ valor, data: `${dd}/${mm}/${yyyy}`, month: monthKey });
  } else {
    if (!dateMatch) warnings.push('Data não encontrada na NFS-e');
    if (valor === 0) warnings.push('Valor não encontrado na NFS-e');
  }

  return {
    entradas, non_revenue: {}, liquido: { ...entradas },
    total_bruto: total, total_non_rev: 0, total_liquido: total,
    warnings, details, titular, isComprovante: true
  };
}

function parseComprovante(text) {
  // Universal comprovante parser: Asaas, Pix (Bradesco, Santander, BB, Itaú, etc.)
  const entradas = {};
  let total = 0;
  const warnings = [];
  const details = [];
  let titular = '';

  // --- Extract TITULAR (recebedor) ---
  // Bradesco: "Dados de quem recebeu\nNome: FULANO"
  let tm = text.match(/(?:quem\s+recebeu|recebedor)\s*(?:Para\s+)?(?:Nome\s*:\s*)?([A-ZÀ-Úa-zà-ú][A-ZÀ-Úa-zà-ú\s]+)/i);
  // BB: "Recebedor\nFulano"
  if (!tm) tm = text.match(/Recebedor\s+([A-ZÀ-Úa-zà-ú][A-ZÀ-Úa-zà-ú\s]+)/i);
  if (tm) titular = tm[1].trim().replace(/\s+/g, ' ');
  // Also try CNPJ/CPF
  const cnpjMatch = text.match(/(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/);
  if (cnpjMatch && titular) titular += ' (CNPJ ' + cnpjMatch[1] + ')';

  // Strategy: find VALUE and DATE from the document

  // --- Find VALUE (OCR-tolerant) ---
  let valor = 0;
  // 1. "Valor pago: R$ X" or "Valor pago R$ X" (Asaas, Santander)
  let valMatch = text.match(/Valor\s+pago\s*:?\s*R\s*\$\s*([\d.,]+)/i);
  // 2. "Valor: R$ X" (Bradesco Pix)
  if (!valMatch) valMatch = text.match(/Valor\s*:?\s*R\s*\$\s*([\d.,]+)/i);
  // 3. "valor de R$ X" (Asaas credit card)
  if (!valMatch) valMatch = text.match(/valor\s+de\s+R\s*\$\s*([\d.,]+)/i);
  // 4. "R$ X" right after "Pix Enviado" (BB)
  if (!valMatch) valMatch = text.match(/Pix\s+Enviado\s*R\s*\$\s*([\d.,]+)/i);
  // 5. "R$ X,XX" with OCR spacing tolerance (R $ 810,00 or R$810,00)
  if (!valMatch) valMatch = text.match(/R\s*\$\s*([\d.,]+)/i);
  // 6. Last resort: look for "X.XXX,XX" or "XXX,XX" pattern (common amount format)
  if (!valMatch) {
    const amounts = [...text.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})/g)];
    if (amounts.length > 0) {
      // Use the first reasonable amount
      for (const am of amounts) {
        const v = parseFloat(am[1].replace(/\./g, '').replace(',', '.'));
        if (v >= 10 && v < 1000000) { valMatch = am; break; }
      }
    }
  }

  if (valMatch) {
    valor = parseFloat(valMatch[1].replace(/\./g, '').replace(',', '.'));
  }

  // --- Find DATE (OCR-tolerant) ---
  let dateStr = null, dd = '', mm = '', yyyy = '';
  // 1. "Data da confirmação: DD/MM/YYYY" (Asaas) — allow OCR errors in accents
  let dateMatch = text.match(/Data\s+da\s+confirma[çc][ãa]o\s*:?\s*(\d{2})\s*\/\s*(\d{2})\s*\/\s*(\d{4})/i);
  // 2. "Data e Hora: DD/MM/YYYY" (Bradesco, generic)
  if (!dateMatch) dateMatch = text.match(/Data\s+e\s+Hora\s*:\s*(\d{2})\s*\/\s*(\d{2})\s*\/\s*(\d{4})/i);
  // 3. "Data do débito: DD/MM/YYYY"
  if (!dateMatch) dateMatch = text.match(/Data\s+do\s+d[ée]bito\s*:\s*(\d{2})\s*\/\s*(\d{2})\s*\/\s*(\d{4})/i);
  // 4. Date at top of Santander format: "DD/MM/YYYY - HH:MM:SS"
  if (!dateMatch) dateMatch = text.match(/(\d{2})\s*\/\s*(\d{2})\s*\/\s*(\d{4})\s*-\s*\d{2}:\d{2}/);
  // 5. "gerado em DD/MM/YYYY" (Asaas comprovante)
  if (!dateMatch) dateMatch = text.match(/gerado\s+em\s+(\d{2})\s*\/\s*(\d{2})\s*\/\s*(\d{4})/i);
  // 6. Fallback: first date found (allow spaces around slashes from OCR)
  if (!dateMatch) dateMatch = text.match(/(\d{2})\s*\/\s*(\d{2})\s*\/\s*(\d{4})/);

  if (dateMatch) {
    dd = dateMatch[1]; mm = dateMatch[2]; yyyy = dateMatch[3];
  }

  if (valor > 0 && dd) {
    const monthKey = `${yyyy}-${mm}`;
    entradas[monthKey] = (entradas[monthKey] || 0) + valor;
    total += valor;
    details.push({ valor, data: `${dd}/${mm}/${yyyy}`, month: monthKey });
  } else {
    if (valor === 0) warnings.push('Valor não detectado no comprovante');
    if (!dd) warnings.push('Data não detectada no comprovante');
  }

  return {
    entradas, non_revenue: {}, liquido: { ...entradas },
    total_bruto: total, total_non_rev: 0, total_liquido: total,
    warnings, details, titular, isComprovante: true
  };
}

function parseContrato(text) {
  // Parse "Contrato de Prestação de Serviços": "valor de R$ X.XXX,XX" + contract date
  const entradas = {};
  let total = 0;
  const warnings = [];
  const details = [];

  // Find value: "valor de R$ X.XXX,XX" — cross-line tolerant for pdf.js
  let valor = 0;
  // Clean trailing comma/period from value (some contracts have "R$3.060,00,")
  let vm = text.match(/valor[\s\S]{0,10}de[\s\S]{0,10}R\$[\s]*([\d.,]+)/i);
  if (!vm) vm = text.match(/valorde[\s]*R\$[\s]*([\d.,]+)/i);
  if (!vm) vm = text.match(/pagar[áa][\s\S]*?R\$[\s]*([\d.,]+)/i);
  if (!vm) vm = text.match(/honor[áa]rios[\s\S]*?R\$[\s]*([\d.,]+)/i);
  if (!vm) vm = text.match(/mensalidade[\s\S]{0,30}R\$[\s]*([\d.,]+)/i);
  // Last resort: first R$ value in the contract (skip if multiple R$ to avoid picking a penalty clause)
  if (!vm) {
    const allR$ = [...text.matchAll(/R\$[\s]*([\d.,]+)/gi)];
    if (allR$.length === 1) vm = allR$[0];
  }
  if (vm) {
    let valStr = vm[1].replace(/[,.]$/, ''); // remove trailing comma/period
    valor = parseFloat(valStr.replace(/\./g, '').replace(',', '.'));
  }

  // Find contract date (most recent date, skip birth dates)
  let monthKey = null;
  const allDates = [...text.matchAll(/(\d{2})\/(\d{2})\/(\d{4})/g)];
  // Filter to recent dates (>= 2024)
  const recentDates = allDates.filter(m => parseInt(m[3]) >= 2024);
  if (recentDates.length > 0) {
    // Use first recent date (usually contract/signing date)
    const d = recentDates[0];
    monthKey = `${d[3]}-${d[2]}`;
    details.push({ valor, data: `${d[1]}/${d[2]}/${d[3]}`, month: monthKey });
  }

  if (valor > 0 && monthKey) {
    entradas[monthKey] = (entradas[monthKey] || 0) + valor;
    total = valor;
  } else {
    if (valor === 0) warnings.push('Valor não encontrado no contrato');
    if (!monthKey) warnings.push('Data não encontrada no contrato');
  }

  return {
    entradas, non_revenue: {}, liquido: { ...entradas },
    total_bruto: total, total_non_rev: 0, total_liquido: total,
    warnings, details, isComprovante: true
  };
}

function parseFilename(filename) {
  // Fallback: extract value and month from filename when OCR/text extraction fails.
  // Patterns like: "885,00 NOV.jpeg", "1.615,00 AGOSTO.pdf", "1800 FEV.jpeg"
  const FNAME_MONTHS = {
    'JAN':'01','JANEIRO':'01','FEV':'02','FEVEREIRO':'02','MAR':'03','MARCO':'03',
    'ABR':'04','ABRIL':'04','MAI':'05','MAIO':'05','JUN':'06','JUNHO':'06',
    'JUL':'07','JULHO':'07','AGO':'08','AGOSTO':'08','SET':'09','SETEMBRO':'09',
    'OUT':'10','OUTUBRO':'10','NOV':'11','NOVEMBRO':'11','DEZ':'12','DEZEMBRO':'12'
  };
  const monthPattern = Object.keys(FNAME_MONTHS).join('|');
  const base = filename.replace(/\.(pdf|jpeg|jpg|png)$/i, '');

  const m = base.match(new RegExp(`([\\d.]+(?:,\\d+)?)\\s+(${monthPattern})(?:\\s|$)`, 'i'));
  if (!m) return null;

  const valStr = m[1];
  const monthName = m[2].toUpperCase();
  const valor = parseFloat(valStr.replace(/\./g, '').replace(',', '.'));
  if (isNaN(valor) || valor <= 0) return null;

  const mm = FNAME_MONTHS[monthName];
  const paymentMonth = parseInt(mm);

  // Infer year: find a date in the filename (YYYY-MM-DD or DD-MM-YYYY)
  let year = null;
  const ymd = filename.match(/(\d{4})-(\d{2})-\d{2}/); // WhatsApp: YYYY-MM-DD
  if (ymd) {
    const fileYear = parseInt(ymd[1]);
    const fileMonth = parseInt(ymd[2]);
    // If payment month > file month, payment was previous year
    year = paymentMonth > fileMonth ? fileYear - 1 : fileYear;
  }
  if (!year) {
    const dmy = filename.match(/\d{2}-(\d{2})-(\d{4})/); // Sicoob: DD-MM-YYYY
    if (dmy) {
      const fileYear = parseInt(dmy[2]);
      const fileMonth = parseInt(dmy[1]);
      year = paymentMonth > fileMonth ? fileYear - 1 : fileYear;
    }
  }
  if (!year) year = new Date().getFullYear(); // last resort

  const monthKey = `${year}-${mm}`;
  return {
    entradas: { [monthKey]: valor },
    non_revenue: {},
    liquido: { [monthKey]: valor },
    total_bruto: valor,
    total_non_rev: 0,
    total_liquido: valor,
    warnings: [`Valor extraído do nome do arquivo (R$ ${valor.toLocaleString('pt-BR',{minimumFractionDigits:2})} em ${monthName}/${year})`],
    details: [{ valor, data: `${monthName}/${year}`, month: monthKey }],
    isComprovante: true,
    fromFilename: true
  };
}

function parsePagBank(text) {
  const entradas = {};
  const details = [];
  let total_bruto = 0;
  let titular = '';

  // Extract titular: first non-empty line is usually the name, then CNPJ on next
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  if (lines.length) titular = lines[0];
  const cnpjMatch = text.match(/CNPJ\s*:\s*(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/);
  if (cnpjMatch) titular = (titular ? titular + ' ' : '') + '(CNPJ ' + cnpjMatch[1] + ')';

  // Remove "Valor Líquido do dia" subtotals to avoid double-counting
  const cleaned = text.replace(/Valor\s+L[ií]quido\s+do\s+dia[:\s]*R\$\s*[\d.,]+/gi, '');

  // Find all transaction dates and their positions
  const dateRegex = /(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}:\d{2})/g;
  const dates = [];
  let m;
  while ((m = dateRegex.exec(cleaned)) !== null) {
    dates.push({ idx: m.index, dd: m[1], mm: m[2], yyyy: m[3], time: m[4] });
  }

  for (let i = 0; i < dates.length; i++) {
    const d = dates[i];
    const start = d.idx;
    const end = i + 1 < dates.length ? dates[i + 1].idx : cleaned.length;
    const chunk = cleaned.substring(start, end);

    // Find all R$ values in this chunk
    const vals = [...chunk.matchAll(/R\$\s*([\d.,]+)/g)].map(v =>
      parseFloat(v[1].replace(/\./g, '').replace(',', '.'))
    ).filter(v => !isNaN(v) && v > 0);

    // Need at least 3 values: bruto, taxa, líquido
    if (vals.length < 3) continue;

    // Check "Aprovada" to confirm it's a real transaction
    if (!/Aprovada/i.test(chunk)) continue;

    const bruto = vals[vals.length - 3];
    const taxa = vals[vals.length - 2];
    const liq = vals[vals.length - 1];
    const monthKey = `${d.yyyy}-${d.mm}`;

    entradas[monthKey] = (entradas[monthKey] || 0) + bruto;
    total_bruto += bruto;
    details.push({ valor: bruto, taxa, liquido: liq, data: `${d.dd}/${d.mm}/${d.yyyy}`, month: monthKey });
  }

  const warnings = [];
  if (details.length === 0) warnings.push('Nenhuma transação PagBank detectada');

  return {
    entradas, non_revenue: {}, liquido: { ...entradas },
    total_bruto, total_non_rev: 0, total_liquido: total_bruto,
    warnings, details, titular
  };
}

function parseGeneric(text, filename) {
  // ===== UNIVERSAL BANK STATEMENT PARSER v3 =====
  // Philosophy: be AGGRESSIVE about finding credits. Better to find too much
  // (user can review) than to miss entries and show "não lido".
  const entradas = {};
  const non_revenue = {};
  const warnings = [];

  const MESES_NOME = {
    'jan':'01','fev':'02','mar':'03','abr':'04','mai':'05','jun':'06',
    'jul':'07','ago':'08','set':'09','out':'10','nov':'11','dez':'12',
    'janeiro':'01','fevereiro':'02','marco':'03','março':'03',
    'abril':'04','maio':'05','junho':'06','julho':'07','agosto':'08',
    'setembro':'09','outubro':'10','novembro':'11','dezembro':'12'
  };

  // ── Strategy 1: Summary totals ──
  // Look for "Total de entradas", "Total de créditos", "Total creditado", etc.
  const summaryPatterns = [
    /Total\s+de\s+entradas\s*[:\s+]?\s*R?\$?\s*\+?\s*([\d.,]+)/i,
    /Total\s+(?:de\s+)?cr[ée]ditos?\s*[:\s]?\s*R?\$?\s*([\d.,]+)/i,
    /Total\s+creditado\s*[:\s]?\s*R?\$?\s*([\d.,]+)/i,
    /Total\s+(?:de\s+)?recebimentos?\s*[:\s]?\s*R?\$?\s*([\d.,]+)/i,
    /Entradas\s*[:\s]\s*R?\$?\s*([\d.,]+)/i
  ];
  for (const pat of summaryPatterns) {
    const m = text.match(pat);
    if (m) {
      const totalVal = parseFloat(m[1].replace(/\./g, '').replace(',', '.'));
      const monthKey = findFirstMonth(text);
      if (monthKey && totalVal > 0) {
        entradas[monthKey] = totalVal;
        checkNonRevenue(text, monthKey, non_revenue);
        return buildResult(entradas, non_revenue, warnings);
      }
    }
  }

  // ── Strategy 2: Line-by-line transaction parsing ──
  // Three passes with decreasing strictness:
  //   Pass A: lines with explicit credit keywords
  //   Pass B: lines with "C" marker or "+" prefix (common in BR bank statements)
  //   Pass C: lines with date + value that are NOT debits (most permissive)
  let currentMonth = null;
  const lines = text.split('\n');

  const SKIP_LINE = /Saldo\s+R\$|SALDO\s+(ANTERIOR|ATUAL|FINAL|INICI|do\s+dia|em\s|total|dispon|bloque|da\s+conta)|^Saldo\b|Saldo\s+[\d.,]+|Limite|Taxa\s+de\s+juros|Vencimento|CET.*Anual|IOF|Tarifas\s+Pend|CPMF|Juros\s+(Cheque|adiant)|cheque\s+especial|Fale\s+com|SAC:|Ouvidoria:|0800|Saldo\s+(disponível|bloqueado|de\s+investimento)|Per[ií]odo\s*:|Categorias:|Solicitado\s+em|Central\s+de\s+(Ajuda|Relacionamento)|P[áa]gina\s+\d|bloqueado\s*\+\s*dispon|N[ãa]o\s+h[áa]\s+linhas|Valores\s+sujeitos|opera[çc][õo]es\s+de\s+cr[ée]dito|EXTRATO\s+DE\s+CONTA|COOPERATIVA|CLIENTE:|USU[ÁA]RIO:|CONTA:|Pix\s+recebido\s+devolvido/i;

  const CREDIT_KEYWORDS = /Pix\s+recebido(?!\s+devolvido)|RECEBIMENTO|PIX_CRED|CRED\s*DOM|CR[ÉE]DITO|Dep[óo]sito\s+(?:de\s+)?vendas|Dep[óo]sito\s+InfinitePay|Vendas\s+Dep|Transfer[êe]ncia\s+recebida|TED\s+recebida|TED\s+CRED|DOC\s+recebido|Resgate|REND\s+POUP|Devolu[çc][ãa]o/i;

  const DEBIT_KEYWORDS = /PAGAMENTO|PAG\s+TIT|PIX_DEB|Pix\s+enviado|Pix\s+recebido\s+devolvido|Enviado|D[ÉE]BITO|Transfer[êe]ncia\s+enviada|LIQUIDACAO|INTEGR\s+PARC|CUSTO\s+ALUGUEL|PJ\s+CONTA|TARIFA|TAR\s+|IOF\s|IMPOSTO|IR\s+S\/|CPMF|DEB\s+|Compra\s+no|COMPRA\s/i;

  // Pass A+B+C combined in single loop for efficiency
  for (const line of lines) {
    const monthFromLine = extractMonthFromLine(line);
    if (monthFromLine) currentMonth = monthFromLine;
    if (!currentMonth) continue;
    if (SKIP_LINE.test(line)) continue;
    // Skip short lines (headers, footers)
    if (line.trim().length < 8) continue;

    const hasCredit = CREDIT_KEYWORDS.test(line);
    const hasDebit = DEBIT_KEYWORDS.test(line);

    // Skip confirmed debits (unless also has credit keyword)
    if (hasDebit && !hasCredit) continue;

    // Check for explicit negative value → debit
    if (/\s-\s*\d/.test(line) || /\s-[\d.,]+\s/.test(line)) {
      if (!hasCredit) continue;
    }

    // Check for "C" or "D" markers at end of value (Santander/Bradesco style: "1.234,56 C")
    const hasCMarker = /[\d.,]+\s+C\b/i.test(line);
    const hasDMarker = /[\d.,]+\s+D\b/i.test(line);
    if (hasDMarker && !hasCredit && !hasCMarker) continue;

    // Determine if this line is a credit
    const isCredit = hasCredit || hasCMarker || /\+[\d.,]/.test(line);

    // For lines without any credit/debit indicator: need a date on this line
    if (!isCredit && !hasDebit) {
      // Only accept if line itself has a date (not just inherited currentMonth)
      if (!monthFromLine) continue;
      // And has a monetary value
      if (!/[\d.]+,\d{2}/.test(line) && !/R\$/.test(line)) continue;
    }

    // ── Extract monetary value ──
    let val = 0;

    // Method 1: R$ X.XXX,XX
    let vm = line.match(/R\$\s*([\d.,]+)/);
    // Method 2: +X.XXX,XX
    if (!vm) vm = line.match(/\+([\d.]+,\d{2})/);
    // Method 3: Value with C marker (e.g., "1.234,56 C")
    if (!vm && hasCMarker) {
      const cm = line.match(/([\d.]+,\d{2})\s+C\b/i);
      if (cm) vm = cm;
    }
    // Method 4: Second-to-last value (transaction value before running saldo)
    if (!vm) {
      const allVals = [...line.matchAll(/([\d.]+,\d{2})/g)];
      if (allVals.length >= 2) {
        vm = [null, allVals[allVals.length - 2][1]];
      } else if (allVals.length === 1 && isCredit) {
        vm = [null, allVals[0][1]];
      }
    }

    if (vm) {
      const valStr = vm[1].replace(/[,.]$/, '');
      val = parseFloat(valStr.replace(/\./g, '').replace(',', '.'));
    }

    if (val > 0 && val < 50000000) {
      entradas[currentMonth] = (entradas[currentMonth] || 0) + val;
      for (const p of NON_REVENUE_PATTERNS) {
        if (line.includes(p)) {
          non_revenue[currentMonth] = (non_revenue[currentMonth] || 0) + val;
          break;
        }
      }
    }
  }

  // ── Strategy 3: Conservative R$ extraction for simple comprovantes ──
  // Only activates when very few R$ values exist (≤5) — safe for single receipts.
  // Bank statements with many values will NOT trigger this (prevents saldo inflation).
  if (Object.keys(entradas).length === 0) {
    const monthKey = findFirstMonth(text);
    if (monthKey) {
      const validValues = [];
      for (const line of lines) {
        if (SKIP_LINE.test(line)) continue;
        if (DEBIT_KEYWORDS.test(line)) continue;
        const rMatches = [...line.matchAll(/R\$\s*([\d.,]+)/g)];
        for (const rm of rMatches) {
          const v = parseFloat(rm[1].replace(/\./g, '').replace(',', '.'));
          if (v > 0 && v < 1000000) validValues.push(v);
        }
      }
      if (validValues.length > 0 && validValues.length <= 5) {
        // Few values = likely a comprovante, use the largest value
        const maxVal = Math.max(...validValues);
        entradas[monthKey] = maxVal;
        warnings.push('Valor extraído automaticamente (maior R$ encontrado) — revise manualmente');
      } else if (validValues.length > 5) {
        warnings.push('Muitos valores detectados — adicione manualmente para evitar erro');
      } else {
        warnings.push('Nenhuma entrada encontrada — adicione os valores manualmente');
      }
    } else {
      warnings.push('Nenhuma data ou entrada encontrada — adicione os valores manualmente');
    }
  }

  if (Object.keys(entradas).length === 0) {
    warnings.push('Nenhuma entrada encontrada — adicione manualmente');
  }

  return buildResult(entradas, non_revenue, warnings);

  // ── Helpers ──
  function monthFromFilename(fn) {
    if (!fn) return null;
    // "Extrato janeiro 2025.pdf" or "Extratoagosto2025.pdf"
    const base = fn.replace(/\.(pdf|jpg|jpeg|png)$/i, '');
    for (const [name, num] of Object.entries(MESES_NOME)) {
      if (name.length < 3) continue; // skip 3-letter abbreviations that might false-match
      const re = new RegExp(name + '\\s*(\\d{4})', 'i');
      const m = base.match(re);
      if (m) return `${m[1]}-${num}`;
    }
    // Also try "Extrato 01-2025" or "Extrato 01_2025"
    const numMatch = base.match(/(\d{2})[\s_-]*(20\d{2})/);
    if (numMatch) return `${numMatch[2]}-${numMatch[1]}`;
    return null;
  }

  function findFirstMonth(txt) {
    // DD/MM/YYYY
    let m = txt.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (m && parseInt(m[3]) >= 2020) return `${m[3]}-${m[2]}`;
    // "D de Month de YYYY"
    m = txt.match(/\d{1,2}\s+de\s+(\w+)\s+de\s+(\d{4})/i);
    if (m) { const mm = MESES_NOME[m[1].toLowerCase()]; if (mm) return `${m[2]}-${mm}`; }
    // "DD Mmm, YYYY"
    m = txt.match(/\d{1,2}\s+(Jan|Fev|Mar|Abr|Mai|Jun|Jul|Ago|Set|Out|Nov|Dez)\w*,?\s+(\d{4})/i);
    if (m) { const mm = MESES_NOME[m[1].toLowerCase().substring(0,3)]; if (mm) return `${m[2]}-${mm}`; }
    // Filename fallback
    return monthFromFilename(filename);
  }

  function findYearContext() {
    // Find a plausible year from the document text
    const ym = text.match(/(202\d)/);
    if (ym) return ym[1];
    // Try filename
    const fm = monthFromFilename(filename);
    if (fm) return fm.substring(0, 4);
    return '2025';
  }

  function extractMonthFromLine(line) {
    // DD/MM/YYYY
    let m = line.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (m && parseInt(m[3]) >= 2020) return `${m[3]}-${m[2]}`;
    // DD/MM without year (common in bank statements like Santander)
    m = line.match(/^(\d{2})\/(\d{2})\s/);
    if (m) {
      const year = findYearContext();
      return `${year}-${m[2]}`;
    }
    // "D de Month de YYYY"
    m = line.match(/(\d{1,2})\s+de\s+(\w+)\s+de\s+(\d{4})/i);
    if (m) { const mm = MESES_NOME[m[2].toLowerCase()]; if (mm && parseInt(m[3]) >= 2020) return `${m[3]}-${mm}`; }
    // "DD Mmm, YYYY"
    m = line.match(/(\d{1,2})\s+(Jan|Fev|Mar|Abr|Mai|Jun|Jul|Ago|Set|Out|Nov|Dez)\w*,?\s+(\d{4})/i);
    if (m) { const mm = MESES_NOME[m[2].toLowerCase().substring(0,3)]; if (mm && parseInt(m[3]) >= 2020) return `${m[3]}-${mm}`; }
    return null;
  }

  function checkNonRevenue(txt, monthKey, nonRev) {
    for (const line of txt.split('\n')) {
      for (const p of NON_REVENUE_PATTERNS) {
        if (line.includes(p)) {
          const vm = line.match(/R\$\s*([\d.,]+)/) || line.match(/\+?\s*([\d.,]+)\s*$/);
          if (vm) {
            const v = parseFloat(vm[1].replace(/\./g, '').replace(',', '.'));
            nonRev[monthKey] = (nonRev[monthKey] || 0) + v;
          }
        }
      }
    }
  }

  function buildResult(ent, nonRev, warns) {
    const liquido = {};
    let total_bruto = 0, total_non_rev = 0;
    for (const m of Object.keys(ent)) {
      const nr = nonRev[m] || 0;
      liquido[m] = ent[m] - nr;
      total_bruto += ent[m];
      total_non_rev += nr;
    }
    return { entradas: ent, non_revenue: nonRev, liquido, total_bruto, total_non_rev, total_liquido: total_bruto - total_non_rev, warnings: warns };
  }
}

// ========== MODAL: PDF REVIEW ==========
let currentPDFEmail = null;
let currentPDFResult = null;

function openPDFUploadForAluno(email) {
  currentPDFEmail = email;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png';
  input.multiple = true;
  input.onchange = async (e) => {
    const files = [...e.target.files];
    if (!files.length) return;
    toast(`Processando ${files.length} arquivo(s)...`);

    // Process ALL files first, then decide how to present
    const results = [];
    const errors = [];
    for (let fi = 0; fi < files.length; fi++) {
      const file = files[fi];
      try {
        const isImage = file.type.startsWith('image/') || /\.(jpg|jpeg|png)$/i.test(file.name);
        toast(`Processando ${fi + 1}/${files.length}: ${file.name}${isImage ? ' (OCR)' : ''}...`);
        let text;
        if (isImage) {
          text = await extractImageText(file);
        } else {
          text = await extractPDFText(file);
        }
        let result = detectBankAndParse(text, file.name);
        result.filename = file.name;
        // Store image preview URL for unreadable images
        if (isImage) {
          result._imageUrl = URL.createObjectURL(file);
        }
        // If no data from content, try parsing the filename as fallback
        if (result.total_liquido === 0 && (!result.details || result.details.length === 0)) {
          const fnResult = parseFilename(file.name);
          if (fnResult) {
            fnResult.filename = file.name;
            fnResult.banco = result.banco !== 'Desconhecido' ? result.banco : 'Arquivo';
            if (isImage) fnResult._imageUrl = result._imageUrl;
            result = fnResult;
          }
          result._unread = true;
        }
        results.push(result);
      } catch (err) {
        console.error('Erro ao processar arquivo:', err, file.name);
        errors.push(file.name);
      }
    }

    if (errors.length) toast(`Erro em ${errors.length} arquivo(s): ${errors.join(', ')}`);
    if (!results.length) { toast('Nenhum arquivo processado com sucesso.'); return; }

    // If single file OR single bank statement → show as-is
    if (results.length === 1) {
      currentPDFResult = results[0];
      currentPDFEmail = email;
      showPDFReviewModal(email, results[0]);
      return;
    }

    // Multiple files: aggregate into one combined result
    const combined = aggregateResults(results);
    currentPDFResult = combined;
    currentPDFEmail = email;
    showPDFReviewModal(email, combined);
  };
  input.click();
}

function aggregateResults(results) {
  const meses = {};
  const non_revenue = {};
  const allDetails = [];
  const allWarnings = [];
  const filenames = [];
  const failedFiles = [];
  const titulares = new Set();
  let total_bruto = 0, total_non_rev = 0;
  const bancos = new Set();

  // Dedup: track seen (value, date) pairs to skip duplicates within this batch
  const seenEntries = new Set();
  let dupCount = 0;
  const dupFiles = [];

  for (const r of results) {
    filenames.push(r.filename || '?');
    bancos.add(r.banco);
    if (r.titular) titulares.add(r.titular);

    // Track files with no data (warn but don't skip — user can fill manually)
    if (r._unread || r._noData || (r.total_liquido === 0 && (!r.details || r.details.length === 0) && Object.keys(r.meses || {}).length === 0)) {
      failedFiles.push({ name: r.filename || '?', imageUrl: r._imageUrl || null });
      // Don't skip — let it contribute its (possibly empty) data
    }

    // Check for duplicate: same details (value + date) already seen
    if (r.details && r.details.length > 0) {
      const entryKey = r.details.map(d => `${d.valor}|${d.data || d.month}`).sort().join(';');
      if (seenEntries.has(entryKey)) {
        dupCount++;
        dupFiles.push(r.filename || '?');
        continue; // Skip this duplicate
      }
      seenEntries.add(entryKey);
    }

    for (const [m, v] of Object.entries(r.meses || {})) {
      meses[m] = (meses[m] || 0) + v;
    }
    for (const [m, v] of Object.entries(r.non_revenue || {})) {
      non_revenue[m] = (non_revenue[m] || 0) + v;
    }
    total_bruto += r.total_bruto || 0;
    total_non_rev += r.total_non_rev || 0;

    if (r.details) allDetails.push(...r.details);
    if (r.warnings) {
      for (const w of r.warnings) {
        if (!allWarnings.includes(w)) allWarnings.push(w);
      }
    }
  }

  // Add warnings for duplicates and failed files
  if (dupCount > 0) {
    allWarnings.unshift(`${dupCount} arquivo(s) duplicado(s) ignorado(s): ${dupFiles.join(', ')}`);
  }
  const unreadPreviews = failedFiles.filter(f => f.imageUrl);
  if (failedFiles.length > 0) {
    allWarnings.unshift(`${failedFiles.length} arquivo(s) não lido(s) — ${unreadPreviews.length > 0 ? 'veja o preview abaixo e ' : ''}adicione manualmente`);
  }

  // Compute líquido
  const meses_liquido = {};
  const allMonths = new Set([...Object.keys(meses), ...Object.keys(non_revenue)]);
  for (const m of allMonths) {
    meses_liquido[m] = (meses[m] || 0) - (non_revenue[m] || 0);
  }

  const banco = bancos.size === 1 ? [...bancos][0] : [...bancos].join(' + ');

  // Build period from all months
  const sortedMonths = [...allMonths].sort();
  const monthNames = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  let periodo = '';
  if (sortedMonths.length) {
    const first = sortedMonths[0].split('-');
    const last = sortedMonths[sortedMonths.length - 1].split('-');
    periodo = `${monthNames[parseInt(first[1])]}/${first[0]}`;
    if (sortedMonths.length > 1) periodo += ` a ${monthNames[parseInt(last[1])]}/${last[0]}`;
  }

  // Combine titulares
  const titular = [...titulares].filter(t => t).join(' / ');

  return {
    banco, periodo, titular,
    meses, non_revenue, meses_liquido,
    total_bruto, total_non_rev,
    total_liquido: total_bruto - total_non_rev,
    warnings: allWarnings,
    details: allDetails,
    isComprovante: results.some(r => r.isComprovante),
    filename: `${results.length} arquivos (${filenames.join(', ')})`,
    _files: filenames,
    _unreadPreviews: unreadPreviews,
    _imageUrl: results.find(r => r._imageUrl)?._imageUrl
  };
}

function addManualMonth() {
  const grid = document.querySelector('.month-input-grid');
  if (!grid) {
    // Create the grid if it doesn't exist (no months detected)
    const container = document.querySelector('.modal h3:last-of-type');
    if (container) {
      const warn = container.nextElementSibling?.nextElementSibling;
      if (warn && warn.classList.contains('pdf-status')) warn.remove();
      const newGrid = document.createElement('div');
      newGrid.className = 'month-input-grid';
      container.parentElement.insertBefore(newGrid, container.nextElementSibling?.nextElementSibling);
    }
    return addManualMonth();
  }
  const now = new Date();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const yyyy = now.getFullYear();
  const div = document.createElement('div');
  div.className = 'month-input-item';
  div.innerHTML = `
    <label><input type="text" value="${yyyy}-${mm}" style="width:80px;text-align:left;font-size:11px;padding:2px 4px" data-month-key> <span style="cursor:pointer;color:var(--red);font-size:14px" onclick="this.closest('.month-input-item').remove()">×</span></label>
    <input type="number" step="0.01" value="0" data-month="" data-bruto="0" data-nr="0">
    <div style="font-size:9px;color:var(--text3);margin-top:2px">Manual</div>
  `;
  // Update data-month on key input change
  const keyInput = div.querySelector('[data-month-key]');
  const valInput = div.querySelector('[data-month]');
  keyInput.addEventListener('input', () => { valInput.dataset.month = keyInput.value; });
  valInput.dataset.month = `${yyyy}-${mm}`;
  grid.appendChild(div);
}
